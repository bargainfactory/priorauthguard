[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pa-guard"
version = "0.1.0"
description = "PriorAuthGuard — privacy-first, self-recursive prior authorization agent platform"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PriorAuthGuard Team" }]
keywords = [
    "healthcare",
    "prior-authorization",
    "HIPAA",
    "FHE",
    "Zama",
    "Concrete-ML",
    "zk-STARK",
    "LangGraph",
    "voice-AI",
]

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",

    # Agents / RAG
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "tenacity>=9.0",

    # Storage / vector
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",

    # Crypto / hashing
    "cryptography>=43",
    "blake3>=0.4",

    # Logging
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

# Heavy optional groups — enabled per-phase to keep core install lean.
fhe = [
    # Zama Concrete ML stack; pinned loosely until Phase 2 lands the circuits.
    # "concrete-ml>=1.9",
    # "brevitas>=0.11",
    # "torch>=2.4",
]

voice = [
    # On-device + cloud voice stack.
    # "faster-whisper>=1.0",     # quantized Whisper
    # "deepgram-sdk>=3.7",
    # "elevenlabs>=1.10",
    # "twilio>=9.3",
]

zkstark = [
    # zk-STARK proof system bindings (placeholder until Phase 2).
]

otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "opentelemetry-instrumentation-sqlalchemy>=0.48",
    "opentelemetry-instrumentation-httpx>=0.48",
]

[project.urls]
Repository = "https://github.com/bargainfactory/priorauthguard"

[tool.hatch.build.targets.wheel]
packages = ["pa_guard"]

# ---------- Tooling ----------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "fhe: tests that exercise the FHE inference path",
    "voice: tests that exercise the voice pipeline",
    "compliance: HIPAA / Safe Harbor / jurisdiction tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",     # handled by formatter
    "S101",     # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# zk-STARK uses mathematical Unicode in docstrings and comments (Greek alpha,
# minus sign, multiplication sign, etc.) — these are deliberate, not typos.
"pa_guard/services/zkstark.py" = ["RUF001", "RUF002", "RUF003", "E702"]
"tests/test_fri.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
