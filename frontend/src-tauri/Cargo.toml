[package]
name = "pa-guard-desktop"
version = "0.4.0"
description = "PriorAuthGuard desktop — Tauri wrapper around the web UI with native on-device Whisper."
authors = ["PriorAuthGuard Team"]
edition = "2021"
license = "Proprietary"

[lib]
name = "pa_guard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-log = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tracing = "0.1"

# whisper-rs is the safe Rust wrapper around whisper.cpp. It downloads,
# builds, and statically links whisper.cpp at compile time. The user must
# have a C++ toolchain available; CI installs it via apt/brew/MSVC.
whisper-rs = { version = "0.13", default-features = false, features = [] }

# hound: 16-bit PCM WAV reader; whisper expects f32 samples at 16kHz.
hound = "3.5"

[features]
# Default: build a release-ready binary. CUDA / Metal / OpenVINO can be added
# behind feature flags when targeting workstations with accelerators.
default = []
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
