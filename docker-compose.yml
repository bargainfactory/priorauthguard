name: priorauthguard

# Local + CI stack: backend + Postgres-with-pgvector + pgAdmin (optional).
#
# Boot with:
#   docker compose up --build
#
# Phase 5 promotion notes:
# - `db` uses pgvector/pgvector — same image production runs on.
# - `backend` flips PAG_PA_REGISTRY_BACKEND=sql so the SqlPARegistry takes
#   over from InMemoryPARegistry.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paguard
      POSTGRES_PASSWORD: paguard_dev_only
      POSTGRES_DB: paguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paguard -d paguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAG_ENVIRONMENT: development
      PAG_API_HOST: 0.0.0.0
      PAG_API_PORT: "8088"
      PAG_DATABASE_URL: postgresql+asyncpg://paguard:paguard_dev_only@db:5432/paguard
      PAG_PA_REGISTRY_BACKEND: sql
      PAG_FHE_ENABLED: "false"
      PAG_ZKSTARK_ENABLED: "false"
      # Provide real payer + LLM credentials via an .env file in production.
    ports:
      - "8088:8088"

  pgadmin:
    profiles: ["debug"]
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@priorauthguard.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  # -----------------------------------------------------------------------
  # Observability profile: `docker compose --profile observability up`
  # boots the full OTel pipeline (Collector -> Tempo + Prometheus -> Grafana).
  # Grafana auto-provisions the SLO dashboard at http://localhost:3001/d/pa-guard-slo.
  # -----------------------------------------------------------------------
  otel:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-metrics
    depends_on:
      - tempo
      - prometheus

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo UI / API

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.0.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
  tempo-data:
  prom-data:
  grafana-data:
