global:
  scrape_interval: 15s
  evaluation_interval: 15s

# This Prometheus is wired in two directions:
#   1) The OTel collector remote-writes service metrics here (incl. the
#      derived RED metrics from spans).
#   2) It scrapes /v1/slo/snapshot itself via prom-exporter rules so
#      "burn rate" is a first-class series — see scrape_configs below.

scrape_configs:
  - job_name: pa-guard-slo
    metrics_path: /v1/slo/snapshot
    params:
      window_seconds: ['0']
    static_configs:
      - targets: ['backend:8080']
    metric_relabel_configs:
      # JSON shape from /v1/slo/snapshot isn't strictly Prometheus — the
      # `slo-bridge` sidecar (deploy/observability/slo-bridge) reformats it
      # into a metrics endpoint. For now we leave this scrape job in place
      # so the bridge can be added with zero config changes.
      - source_labels: [__name__]
        regex: pa_guard_slo_.*
        action: keep

  - job_name: otel-collector
    static_configs:
      - targets: ['otel:8888']
