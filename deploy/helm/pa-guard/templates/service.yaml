apiVersion: v1
kind: Service
metadata:
  name: {{ include "pa-guard.fullname" . }}
  labels:
    {{- include "pa-guard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pa-guard.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa-guard.fullname" . }}
  labels:
    {{- include "pa-guard.labels" . | nindent 4 }}
