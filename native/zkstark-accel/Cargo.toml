[package]
name = "zkstark_native"
version = "0.1.0"
edition = "2021"
description = "Native acceleration for PriorAuthGuard's pure-Python FRI prover."
license = "Proprietary"

[lib]
name = "zkstark_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
blake2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
